<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура системы</title>
  <desc id="desc">Упрощенная схема основных блоков и связей.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .boundary-title { font: 800 18px Arial, sans-serif; fill: #334155; }
      .external { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .app { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .agent { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 2; }
      .data { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .db { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .text { font: 800 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 700 13px Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .label { font: 700 12px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820" />
  <text x="700" y="58" text-anchor="middle" class="title">Архитектура системы</text>

  <rect x="235" y="105" width="930" height="610" rx="18" class="boundary" />
  <text x="265" y="138" class="boundary-title">Цифровой руководитель проекта</text>

  <rect x="55" y="330" width="150" height="90" rx="12" class="external" />
  <text x="130" y="370" text-anchor="middle" class="text">Пользователь</text>
  <text x="130" y="394" text-anchor="middle" class="small">РП / портфель</text>

  <rect x="295" y="315" width="190" height="120" rx="14" class="app" />
  <text x="390" y="365" text-anchor="middle" class="text">Веб-интерфейс</text>
  <text x="390" y="392" text-anchor="middle" class="small">браузерное приложение</text>

  <rect x="595" y="195" width="210" height="120" rx="14" class="app" />
  <text x="700" y="245" text-anchor="middle" class="text">Сервис данных</text>
  <text x="700" y="272" text-anchor="middle" class="small">сводки и метрики</text>

  <rect x="595" y="435" width="210" height="120" rx="14" class="agent" />
  <text x="700" y="485" text-anchor="middle" class="text">Сервис агентов</text>
  <text x="700" y="512" text-anchor="middle" class="small">вывод и чат</text>

  <g transform="translate(920 315)">
    <ellipse cx="105" cy="25" rx="95" ry="22" class="db" />
    <path d="M10 25v82c0 13 43 23 95 23s95-10 95-23V25" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path d="M10 66c0 13 43 23 95 23s95-10 95-23" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <text x="105" y="61" text-anchor="middle" class="text">Хранилище данных</text>
    <text x="105" y="87" text-anchor="middle" class="small">данные проектов</text>
  </g>

  <rect x="595" y="610" width="210" height="80" rx="14" class="data" />
  <text x="700" y="644" text-anchor="middle" class="text">Обработка документов</text>
  <text x="700" y="668" text-anchor="middle" class="small">разбор и обновление</text>

  <rect x="930" y="610" width="190" height="80" rx="14" class="data" />
  <text x="1025" y="644" text-anchor="middle" class="text">Файлы результатов</text>
  <text x="1025" y="668" text-anchor="middle" class="small">результаты обработки</text>

  <rect x="55" y="610" width="165" height="80" rx="12" class="external" />
  <text x="137" y="644" text-anchor="middle" class="text">Документы</text>
  <text x="137" y="668" text-anchor="middle" class="small">паспорта проектов</text>

  <rect x="55" y="170" width="165" height="80" rx="12" class="external" />
  <text x="137" y="204" text-anchor="middle" class="text">Проектный контур</text>
  <text x="137" y="228" text-anchor="middle" class="small">исходные факты</text>

  <rect x="1205" y="435" width="150" height="90" rx="12" class="external" />
  <text x="1280" y="474" text-anchor="middle" class="text">Языковая модель</text>
  <text x="1280" y="498" text-anchor="middle" class="small">API модели</text>

  <path d="M205 375 H295" class="line" />
  <rect x="228" y="358" width="44" height="22" rx="11" class="label-bg" />
  <text x="250" y="373" text-anchor="middle" class="label">работа</text>

  <path d="M485 350 C535 320 548 275 595 255" class="line" />
  <rect x="512" y="294" width="52" height="22" rx="11" class="label-bg" />
  <text x="538" y="309" text-anchor="middle" class="label">сводки</text>

  <path d="M485 400 C535 430 548 475 595 495" class="line" />
  <rect x="512" y="440" width="52" height="22" rx="11" class="label-bg" />
  <text x="538" y="455" text-anchor="middle" class="label">вопросы</text>

  <path d="M805 255 C880 255 890 350 930 360" class="line" />
  <rect x="858" y="300" width="40" height="22" rx="11" class="label-bg" />
  <text x="878" y="315" text-anchor="middle" class="label">данные</text>

  <path d="M805 495 C875 495 890 410 930 400" class="line" />
  <rect x="846" y="443" width="64" height="22" rx="11" class="label-bg" />
  <text x="878" y="458" text-anchor="middle" class="label">факты</text>

  <path d="M805 495 H1205" class="line" />
  <rect x="962" y="478" width="88" height="22" rx="11" class="label-bg" />
  <text x="1006" y="493" text-anchor="middle" class="label">запросы</text>

  <path d="M220 650 H595" class="line" />
  <rect x="365" y="633" width="72" height="22" rx="11" class="label-bg" />
  <text x="401" y="648" text-anchor="middle" class="label">разбор</text>

  <path d="M700 610 V555" class="line" />
  <rect x="724" y="574" width="82" height="22" rx="11" class="label-bg" />
  <text x="765" y="589" text-anchor="middle" class="label">агенты</text>

  <path d="M805 650 H930" class="line" />
  <rect x="846" y="633" width="54" height="22" rx="11" class="label-bg" />
  <text x="873" y="648" text-anchor="middle" class="label">файлы</text>

  <path d="M220 210 C470 120 870 160 955 315" class="line" />
  <rect x="510" y="147" width="74" height="22" rx="11" class="label-bg" />
  <text x="547" y="162" text-anchor="middle" class="label">импорт</text>
</svg>
