services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdm_hack_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_AGENTS_API_URL: ${VITE_AGENTS_API_URL:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-5180}:5180"
    depends_on:
      - backend
      - agents
    networks:
      - sdm_hack

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdm_hack_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://sdm_hack:sdm_hack_password@postgres:5432/sdm_hack}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sdm_hack

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    container_name: sdm_hack_agents
    restart: unless-stopped
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      AGENTS_CORS_ORIGINS: ${AGENTS_CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-}
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-}
    ports:
      - "${AGENTS_PORT:-8010}:8010"
    depends_on:
      - backend
    networks:
      - sdm_hack

  postgres:
    image: postgres:16-alpine
    container_name: sdm_hack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdm_hack}
      POSTGRES_USER: ${POSTGRES_USER:-sdm_hack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdm_hack_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdm_hack

networks:
  sdm_hack:
    driver: bridge
